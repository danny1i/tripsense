name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit, integration and component tests
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests (production build, Demo Mode)
        run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cfn-lint
      - run: cfn-lint infra/cloudformation/*.yaml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tripsense:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name tripsense -p 8080:8080 tripsense:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/api/health && exit 0; sleep 1; done
          docker logs tripsense
          exit 1
      # Proposed (not implemented): push to Amazon ECR and deploy the ECS
      # service via CloudFormation, using GitHub OIDC → IAM role (no long-lived keys).
