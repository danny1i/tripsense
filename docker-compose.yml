# Local stack: `docker compose up` → http://localhost:8080
#
# - app: React frontend + Node BFF + agent (Demo Mode unless ANTHROPIC_API_KEY is set)
# - db:  OPTIONAL PostgreSQL with the documented travel schema and demo seed.
#        The prototype app reads demo data in-process; the database shows the
#        production data model and is NOT queried by the app yet.
#        Start it with: docker compose --profile db up
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ALLOWED_ORIGINS: http://localhost:8080
      LOG_EVENTS: "true"
      # Optional, server-side only. Leave unset for Demo Mode.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
    restart: unless-stopped

  db:
    profiles: ["db"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tripsense
      POSTGRES_USER: tripsense
      # Local development only. Production uses AWS Secrets Manager.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripsense_local_only}
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
